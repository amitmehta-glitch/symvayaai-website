    return `<div class="sec-head"><div><span class="eyebrow">Review</span><h2>Check your answers and send them</h2><p>${n === NAV.bcaps.length ? 'All 28 readiness questions answered. Thank you.' : `${missing.length} question${missing.length > 1 ? 's are' : ' is'} still open. You can send now, but unanswered questions count as missing.`}</p></div></div>
      <div class="grid2"><div class="card"><div class="tbl-wrap"><table class="t"><thead><tr><th>Section</th><th class="n">Answered</th><th class="n">Don’t know</th><th></th></tr></thead><tbody>
        <tr><td>Ambition and AI types</td><td class="n">${s.ambition != null ? '✓' : '—'}</td><td class="n"></td><td><button class="btn sm" data-q="go" data-i="1">Edit</button></td></tr>${rows}<tr><td>Results so far</td><td class="n">${Object.keys(s.outcomes || {}).length} / ${NAV.outcomeQs.length}</td><td class="n"></td><td><button class="btn sm" data-q="go" data-i="${STEPS.indexOf('outcomes')}">Edit</button></td></tr></tbody></table></div></div>
      <div class="card stack"><h3>Send your response</h3><p class="small">${this.canSend() ? 'Press send and your answers go to the Enterprise AI Navigator team, who combine them with your colleagues’ answers into your organisation’s report. You can download a copy afterwards.' : 'Download your response file, then email it to ' + (this.s.invitedBy ? esc(this.s.invitedBy) : 'the person who invited you') + '. It contains your details and your answers — nothing else.'}</p>
        <div class="consents">${this.canSend() ? `<label class="consent" for="r_emailCopy"><input type="checkbox" id="r_emailCopy" data-r="emailCopy" ${s.resp.emailCopy !== false ? 'checked' : ''}><span>Email me a copy of my answers${s.resp.email ? ' at ' + esc(s.resp.email.trim()) : ''}.</span></label>` : ''}<label class="consent" for="r_consent"><input type="checkbox" id="r_consent" data-r="consent" ${s.resp.consent ? 'checked' : ''}><span>${esc(NAV.consentText.research)}</span></label>
          <label class="consent" for="r_consentNamed"><input type="checkbox" id="r_consentNamed" data-r="consentNamed" ${s.resp.consentNamed ? 'checked' : ''}><span>${esc(NAV.consentText.named)}</span></label>
          <label class="consent" for="r_consentContact"><input type="checkbox" id="r_consentContact" data-r="consentContact" ${s.resp.consentContact ? 'checked' : ''}><span>${esc(NAV.consentText.contact)}</span></label>
          <p class="tiny muted">All three are optional; your organisation’s report is the same either way. ${esc(NAV.consentText.notice)}</p></div>
        <button class="btn pri" data-q="finish">${this.canSend() ? 'Finish and send my response' : this.dl ? 'Finish and download response file' : 'Finish and get my response'}</button>
        <p class="tiny muted">${esc(s.resp.name)} · ${esc(NAV.roles[s.resp.role] || '')} · ${esc(s.resp.org)}</p></div></div>
      ${this.nav(true, false)}`;
  },

  payload() {
    const s = this.s; const answers = {};
    NAV.bcaps.forEach(c => { const a = s.answers[c.id]; answers[c.id] = a && a.l != null ? { l: a.l === 0 ? null : a.l, dk: a.l === 0, s: a.s || 'assumed', n: a.n || '' } : { l: null, dk: false, s: null, n: '' }; });
    return { type: 'enterprise-ai-navigator/readiness-response', v: NAV.Q_VERSION, id: s.id, submittedAt: new Date().toISOString(),
      respondent: { name: s.resp.name.trim(), email: s.resp.email.trim(), role: +s.resp.role, roleName: NAV.roles[s.resp.role] || '', org: s.resp.org.trim(), unit: s.resp.unit.trim(),
        industry: s.resp.industry === '' ? null : +s.resp.industry, industryName: NAV.industries[s.resp.industry] || '', size: s.resp.size === '' ? null : +s.resp.size, sizeName: NAV.sizes[s.resp.size] || '', region: s.resp.region === '' || s.resp.region == null ? null : +s.resp.region, regionName: NAV.regions[s.resp.region] || '',
        seniority: s.resp.seniority === '' || s.resp.seniority == null ? null : +s.resp.seniority, seniorityName: NAV.seniorities[s.resp.seniority] || '', ownership: s.resp.ownership === '' || s.resp.ownership == null ? null : +s.resp.ownership, ownershipName: NAV.ownerships[s.resp.ownership] || '' },
      consent: { research: !!s.resp.consent, named: !!s.resp.consentNamed, contact: !!s.resp.consentContact, text: NAV.consentText.research, notice: NAV.consentText.notice, at: new Date().toISOString() },
      wave: NAV.Q_WAVE, durationSec: s.started ? Math.max(0, Math.round((Date.now() - Date.parse(s.started)) / 1000)) : null,
      outcomes: Object.fromEntries(NAV.outcomeQs.map(x => { const v = (s.outcomes || {})[x.id]; return [x.id, v == null ? null : { v: v === x.o.length - 1 ? null : v, dk: v === x.o.length - 1, label: x.o[v] }]; })),
      invitedBy: s.invitedBy || '', ambition: s.ambition || '', patterns: s.patterns.slice(), answers };
  },
  fname() { const p = this.payload(); const slug = (x) => (x || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 30); return `ai-readiness-${slug(p.respondent.org) || 'org'}-${slug(p.respondent.name) || 'respondent'}.json`; },
  async download() {
    if (!this.dl) return false;
    try { await this.dl.save({ filename: this.fname(), data: JSON.stringify(this.payload(), null, 1) }); return true; } catch (e) { if (e && e.code !== 'declined') toast('The download did not start. Use “Copy response” instead.'); return false; }
  },
  canSend() { return window.Q_SEND === 'netlify' && /^https?:$/.test(location.protocol) && !/claude/.test(location.host); },
  async send() {
    const p = this.payload(), r = p.respondent;
    const body = new URLSearchParams({ 'form-name': 'readiness-response', name: r.name, email: r.email, organisation: r.org, code: RCODE.enc(p), role: r.roleName, industry: r.industryName, size: r.sizeName, region: r.regionName, seniority: r.seniorityName, ownership: r.ownershipName, research_consent: p.consent.research ? 'yes' : 'no', named_consent: p.consent.named ? 'yes' : 'no', contact_consent: p.consent.contact ? 'yes' : 'no', wave: p.wave, invited_by: p.invitedBy, response: JSON.stringify(p) });
    this.sending = true; this.render();
    /* The server files the response by company and emails the copy; the Netlify form is kept as a backup. Either one is enough. */
    let apiOk = false, formOk = false; this.emailed = false;
    try { const ra = await fetch('/api/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ response: p, emailCopy: this.s.resp.emailCopy !== false }) });
      const o = await ra.json().catch(() => ({})); if (ra.ok && o.ok) { apiOk = true; this.emailed = !!o.emailed; } } catch (e) { /* server not reachable: the form still counts */ }
    try { const rf = await fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body.toString() }); formOk = rf.ok; } catch (e) { /* network */ }
    try { if (!apiOk && !formOk) throw new Error('not sent'); this.sent = true; this.resumed = false; try { localStorage.removeItem(QKEY); } catch (e2) { /* private mode */ } toast('Sent to the Enterprise AI Navigator team'); }
    catch (e) { this.sendFail = true; toast('Not sent. Check your connection and try again.'); }
    this.sending = false; this.render();
  },
  vDone() {
    const p = this.payload(); const code = RCODE.enc(p);
    const bars = NAV.bgroups.map(g => { const v = NAV.bcaps.filter(c => c.g === g.id).map(c => p.answers[c.id].l).filter(x => x != null); const av = v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; return `<div><div class="row small" style="justify-content:space-between"><span>${esc(g.name)}</span><b>${av == null ? '—' : av.toFixed(1)}</b></div><div class="bar"><i style="width:${av == null ? 0 : (av - 1) / 4 * 100}%"></i></div></div>`; }).join('');
    const first = esc(p.respondent.name.split(' ')[0] || '');
    const to = this.s.invitedBy ? esc(this.s.invitedBy) : 'the person who invited you';
    const mailTo = `<a href="mailto:${esc(NAV.contactEmail)}">${esc(NAV.contactEmail)}</a>`;
    const head = this.canSend()
      ? (this.sent ? `<h1>Done. Your response has reached the Enterprise AI Navigator team</h1><p class="why">Thank you. Your answers will be combined with your colleagues’ to build your organisation’s readiness report.${this.emailed ? ` We have emailed a copy of your answers to ${esc(p.respondent.email)}.` : ''}</p>`
        : this.sending ? `<h1>Sending your response…</h1><p class="why">This takes a moment.</p>`
        : `<h1>${this.sendFail ? 'Sending did not work. Please try again' : 'One last step: send your response'}</h1><p class="why">${this.sendFail ? `Check your connection and press Send again. If it still fails, download your answers and email the file to ${mailTo}.` : 'Press Send to share your answers with the Enterprise AI Navigator team.'}</p>`)
      : `<h1>One last step: send your response file</h1><p class="why">${this.dl ? 'Your file should have downloaded. If it did not, download it again or copy the response code below.' : 'Copy your response code below and paste it into an email.'} Send it to ${to}.</p>`;
    const btns = (this.canSend() && !this.sent ? `<button class="btn pri" data-q="send" ${this.sending ? 'disabled' : ''}>Send my response</button>` : '') + (this.canSend() ? `<button class="btn ${this.sent ? 'pri' : ''}" data-q="pdf">Save a PDF of your answers</button>` : this.dl ? '<button class="btn pri" data-q="dl">Download response file again</button>' : '') + '<button class="btn" data-q="edit">Change my answers</button>';
    const right = this.sent
      ? `<div class="card stack"><h3>What happens next</h3><ul class="list"><li>${this.s.invitedBy ? esc(this.s.invitedBy) + ' and the' : 'The'} Enterprise AI Navigator team combine your answers with your colleagues’.</li><li>Your organisation receives a readiness report: where you stand, the gaps to close first and a plan.</li><li>To keep your own copy, press <b>Save a PDF of your answers</b> and choose “Save as PDF”.</li><li>Questions, or want your data deleted? Write to ${mailTo}.</li></ul></div>`
      : `<div class="card stack"><h3>${this.canSend() ? 'If sending keeps failing' : 'Sending the file'}</h3><p class="small">${this.canSend() ? `Download your answers and email the file to ${mailTo}.` : `Attach the downloaded file to an email to ${to}.`}</p>${this.canSend() && this.dl ? '<button class="btn sm" data-q="dl" style="align-self:flex-start">Download response file</button>' : ''}
        <details class="qcode"><summary>Can’t attach a file? Use your response code</summary><p class="small muted" style="margin-top:8px">Copy this code into the body of your email. It holds all your answers.</p><textarea id="respText" rows="4" readonly>${esc(code)}</textarea><button class="btn sm" data-q="copy" style="margin-top:8px">Copy response code</button></details></div>`;
    return `<section class="instrument qhero"><span class="eyebrow">${this.canSend() && !this.sent ? 'Not sent yet' : 'Thank you, ' + first}</span>${head}
      <div class="row" style="margin-top:14px;gap:8px;flex-wrap:wrap">${btns}</div></section>
      <div class="grid2"><div class="card stack"><h3>Your view, by stage</h3><p class="small muted">Average of your answers on the 1–5 scale. The report combines everyone’s answers.</p>${bars}</div>
      ${right}</div>`;
  },

  /* A readable copy of the respondent's own answers, saved as PDF through the browser's print dialog */
  personal() {
    const p = this.payload(), r = p.respondent, A = p.answers;
    const date = new Date().toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
    const st = NAV.bgroups.map(g => { const v = NAV.bcaps.filter(c => c.g === g.id).map(c => A[c.id].l).filter(x => x != null); return { g, v, av: v.length ? v.reduce((a, b) => a + b, 0) / v.length : null }; });
    let stuck = null; for (const x of st.filter(x => x.g.id !== 'F')) { if (x.av == null || x.av < 2.75 || Math.min(...x.v) < 2) { stuck = x; break; } }
    const answered = st.some(x => x.av != null);
    const bar = x => `<tr><td>${esc(x.g.id === 'F' ? 'Foundations' : 'Stage ' + x.g.id.slice(1) + ' · ' + x.g.short)}</td><td class="pbar"><i style="width:${x.av == null ? 0 : (x.av - 1) / 4 * 100}%"></i></td><td class="pn">${x.av == null ? '—' : x.av.toFixed(1)}</td></tr>`;
    const rows = NAV.bgroups.map(g => `<tr class="pg"><td colspan="2">${esc(g.name)}</td></tr>` + NAV.bcaps.filter(c => c.g === g.id).map(c => { const a = A[c.id], q = NAV.bq[c.id]; return `<tr><td>${esc(q.q)}</td><td>${a.dk ? '<i>Don’t know</i>' : a.l ? `<b>${a.l}</b> · ${esc(q.o[a.l - 1])}` : '<i>Not answered</i>'}${a.n ? `<div class="pnote">${esc(a.n)}</div>` : ''}</td></tr>`; }).join('')).join('');
    const outs = NAV.outcomeQs.map(x => { const o = p.outcomes[x.id]; return `<tr><td>${esc(x.q)}</td><td>${!o ? '<i>Not answered</i>' : o.dk ? '<i>Don’t know</i>' : esc(x.o[o.v])}</td></tr>`; }).join('');
    const amb = NAV.ambitions.find(a => a.id === p.ambition);
    return `<div class="phead"><div class="pbrand">Enterprise AI Navigator</div><h1>Your AI readiness answers</h1><p>${esc(r.name)} · ${esc(r.roleName)} · ${esc(r.org)} · ${date}</p></div>
      <h2>Your view, in short</h2>
      <p>${!answered ? 'You did not rate any capabilities.' : stuck ? `In your view, AI work at ${esc(r.org || 'your organisation')} gets stuck at <b>Stage ${stuck.g.id.slice(1)}, ${esc(stuck.g.name.replace(/^Stage \d · /, ''))}</b>: the first stage where your answers average below 3 or include a 1.` : 'In your view, AI work does not get stuck at any of the six stages: each averages 3 or more in your answers.'}${amb ? ` The goal you chose for the next 12 to 18 months: <b>${esc(amb.name)}</b>.` : ''}</p>
      <table class="pbars">${st.map(bar).join('')}</table>
      <p class="psmall">Average of your answers for each stage, on a scale of 1 (ad hoc) to 5 (optimised).</p>
      <h2>Your answers</h2><table class="pt">${rows}</table>
      <h2>Results so far</h2><table class="pt">${outs}</table>
      <p class="psmall">This is your own view. Your organisation’s report combines your answers with your colleagues’, and shows where you agree and disagree. To see, correct or delete your data, write to ${esc(NAV.dataEmail)}.</p>`;
  },
  printPDF() {
    let d = document.getElementById('printView'); if (!d) { d = document.createElement('div'); d.id = 'printView'; document.body.appendChild(d); }
    d.innerHTML = this.personal(); const t = document.title; document.title = 'AI readiness answers - ' + (this.s.resp.name || '').trim();
    setTimeout(() => { window.print(); document.title = t; }, 50);
  },

  bind() {
    document.addEventListener('input', e => {
      const t = e.target;
      if (t.dataset.r) { this.s.resp[t.dataset.r] = t.type === 'checkbox' ? t.checked : t.value; this.save(); const nb = document.querySelector('[data-q=next]'); if (nb && STEPS[this.s.step] === 'intro') { nb.disabled = !this.canLeaveIntro(); const need = document.getElementById('introNeed'); if (need) need.textContent = this.introNeed(); const eh = document.getElementById('emailHint'); if (eh && t.dataset.r === 'email') eh.textContent = t.value.trim() && NAV.workEmailIssue(t.value) ? NAV.workEmailIssue(t.value) : 'Your work address groups your answers with your colleagues’. It is never published.'; } document.querySelectorAll('.qstep').forEach((b, i) => { if (i > 0) b.disabled = !this.canLeaveIntro(); }); }
      if (t.dataset.q === 'note') { const a = this.s.answers[t.dataset.id] = this.s.answers[t.dataset.id] || {}; a.n = t.value; this.save(); }
    });
    document.addEventListener('change', e => {
      const t = e.target; const q = t.dataset.q;
      if (q === 'ans') { const a = this.s.answers[t.dataset.id] = this.s.answers[t.dataset.id] || {}; a.l = +t.value; if (!a.s) a.s = 'assumed'; this.save(); this.keepScroll(() => this.render()); const el = document.querySelector(`input[name="l_${t.dataset.id}"][value="${t.value}"]`); if (el) el.focus({ preventScroll: true }); }
      if (q === 'out') { this.s.outcomes[t.dataset.id] = +t.value; this.save(); this.keepScroll(() => this.render()); }
      if (q === 'amb') { this.s.ambition = t.value; this.save(); this.keepScroll(() => this.render()); }
      if (q === 'pat') { const ps = this.s.patterns; const i = ps.indexOf(t.value); if (t.checked && i < 0) ps.push(t.value); if (!t.checked && i >= 0) ps.splice(i, 1); this.save(); this.keepScroll(() => this.render()); }
      if (t.dataset.r === 'role') { this.s.resp.role = t.value; this.save(); this.render(); }
    });
    document.addEventListener('click', async e => {
      const b = e.target.closest('[data-q]'); if (!b || b.tagName === 'INPUT' || b.tagName === 'TEXTAREA') return;
      const q = b.dataset.q;
      if (q === 'next') this.go(this.s.step + 1);
      if (q === 'prev') this.go(this.s.step - 1);
      if (q === 'go') { this.done = false; this.go(+b.dataset.i); }
      if (q === 'sure') { this.s.answers[b.dataset.id].s = b.dataset.v; this.save(); this.keepScroll(() => this.render()); }
      if (q === 'restart' || q === 'fresh') { this.s = this.blank(); this.prefill(); this.resumed = false; this.done = false; this.sent = false; this.sendFail = false; this.save(); this.render(); window.scrollTo(0, 0); if (q === 'fresh') toast('Fresh form ready'); }
      if (q === 'keep') { this.resumed = false; this.render(); }
      if (q === 'finish' && NAV.workEmailIssue(this.s.resp.email)) { toast(NAV.workEmailIssue(this.s.resp.email)); this.go(0); setTimeout(() => { const e = document.getElementById('r_email'); if (e) e.focus(); }, 300); return; }
      if (q === 'finish') { this.done = true; this.render(); window.scrollTo(0, 0); if (this.canSend()) await this.send(); else await this.download(); }
      if (q === 'send') await this.send();
      if (q === 'dl') await this.download();
      if (q === 'pdf') this.printPDF();
      if (q === 'copy') { const t = document.getElementById('respText'); try { await navigator.clipboard.writeText(RCODE.enc(this.payload())); toast('Response code copied: paste it into an email'); } catch (err) { t.focus(); t.select(); toast('Select all the text and copy it'); } }
      if (q === 'edit') { this.done = false; this.go(STEPS.length - 1); }
      if (q === 'cont') await this.showContinue();
      if (q === 'contClose') { const m = document.querySelector('.qmodal-bg'); if (m) m.remove(); }
      if (q === 'contCopy') { const i = document.getElementById('contLink'); try { await navigator.clipboard.writeText(i.value); toast('Link copied'); } catch (err) { i.focus(); i.select(); toast('Select the link and copy it'); } }
      if (q === 'noteOpen') { this.noteOpen = b.dataset.id; this.keepScroll(() => this.render()); const ta = document.querySelector(`textarea[data-id="${b.dataset.id}"]`); if (ta) ta.focus({ preventScroll: true }); }
      if (q === 'orgEdit') { this.s.orgEdit = true; this.save(); this.render(); }
    });
  },
  keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }
};
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2800); }

window.Q_SEND = 'netlify'; window.Q_BRAND = '';
Q.init();
</script></body></html>
