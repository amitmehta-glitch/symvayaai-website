/* ============================================================
   Tool — AI Readiness Baseline (enterprise level)
   ============================================================ */
const BASE = {};
BASE.tabs = [['overview', 'Journey position'], ['ambition', 'Where you want to go'], ['assess', 'Where you are today'], ['gaps', 'Gap map'], ['bench', 'How others compare'], ['roadmap', 'Roadmap'], ['report', 'Report']];
BASE.phaseIds = ['P1', 'P2', 'P3', 'P4', 'P5', 'P6'];

/* ---------------- engine ---------------- */
function baseTarget(b, cap) {
  const st = b.caps[cap.id] || {};
  const amb = NAV.ambitions.find(a => a.id === b.ambition) || NAV.ambitions[1];
  const raisedBy = (b.patterns || []).filter(pid => (NAV.patternUplift[pid] || []).includes(cap.id));
  const derived = clamp(amb.t[cap.g] + (raisedBy.length ? 1 : 0), 1, 5);
  return { t: st.t != null ? st.t : derived, derived, manual: st.t != null, raisedBy };
}

function assessBaseline(b) {
  const caps = NAV.bcaps.map(cap => {
    const st = b.caps[cap.id] || { c: null, ev: 'assumed' };
    const T = baseTarget(b, cap); const cur = st.c;
    const ew = cur == null ? null : 1 + (cur - 1) * evW(st.ev);
    return { cap, st, cur, ew, ...T, gap: cur == null ? null : Math.max(0, T.t - cur) };
  });
  const groups = {};
  NAV.bgroups.forEach(g => {
    const cs = caps.filter(x => x.cap.g === g.id); const sc = cs.filter(x => x.cur != null);
    const avg = (arr, f) => arr.length ? arr.reduce((a, x) => a + f(x), 0) / arr.length : null;
    groups[g.id] = { g, cs, n: sc.length, cur: avg(sc, x => x.cur), ew: avg(sc, x => x.ew), tgt: avg(cs, x => x.t), gap: avg(sc, x => x.gap) };
  });
  const ph = BASE.phaseIds.map(id => groups[id]).filter(x => x.cur != null);
  const avg = ph.length ? ph.reduce((a, x) => a + x.cur, 0) / ph.length : null;
  const min = ph.length ? Math.min(...ph.map(x => x.cur)) : null;
  const ewAvg = ph.length ? ph.reduce((a, x) => a + x.ew, 0) / ph.length : null;
  const ewMin = ph.length ? Math.min(...ph.map(x => x.ew)) : null;
  const chain = (av, mn) => av == null ? null : clamp((Math.min(av, mn + 1) - 1) / 4 * 100, 0, 100);
  const reliable = (G, key) => { const v = G[key]; if (v == null || v < 2.75) return false; const lv = G.cs.map(x => key === 'cur' ? x.cur : x.t).filter(x => x != null); return lv.length && Math.min(...lv) >= 2; };
  const reachOf = (key) => { let k = 0; for (const id of BASE.phaseIds) { if (reliable(groups[id], key)) k++; else break; } return k; };
  const reach = reachOf('cur'), targetReach = reachOf('tgt');
  const scored = caps.filter(x => x.cur != null).length;
  const s = { avg: avg || 0, g: {}, c: {}, spread: ph.length ? Math.max(...ph.map(x => x.cur)) - min : 0 };
  BASE.phaseIds.forEach(id => s.g[id] = groups[id].cur == null ? 0 : groups[id].cur);
  caps.forEach(x => s.c[x.cap.id] = x.cur);
  const arche = scored >= 12 ? NAV.archetypes.find(a => a.test(s)) : null;
  const pri = caps.filter(x => x.gap > 0).map(x => ({ ...x, pr: x.gap * NAV.upstream[x.cap.g] * (x.cur <= 1 ? 1.15 : 1) })).sort((a, b2) => b2.pr - a.pr);
  const stall = reach < 6 ? reach + 1 : null;
  const pidx = (g) => g === 'F' ? 0 : +g.slice(1);
  const stallG = stall ? 'P' + stall : null; const horizon = stall || 6;
  const now = [], next = [], later = [];
  pri.forEach(x => {
    const i = pidx(x.cap.g);
    const isNow = x.cap.g === stallG || (x.cap.g !== 'F' && i < horizon && x.gap >= 2) || (x.cap.g === 'F' && x.gap >= 2);
    const isNext = (x.cap.g !== 'F' && i <= horizon + 1) || x.cap.g === 'F';
    if (isNow && now.length < 7) now.push(x); else if (isNext && next.length < 8) next.push(x); else later.push(x);
  });
  while (now.length < 4 && (next.length || later.length)) { const pool = next.length ? next : later; now.push(pool.shift()); }
  while (next.length < 6 && later.length) next.push(later.shift());
  return { caps, groups, avg, min, index: chain(avg, min), ewIndex: chain(ewAvg, ewMin), reach, targetReach, stall, arche, pri, road: { now, next, later }, scored, total: caps.length,
    gapCount: pri.length, gapSum: pri.reduce((a, x) => a + x.gap, 0) };
}

/* ---------------- chart: journey ladder ---------------- */
Chart.ladder = function (b, A, opts) {
  opts = opts || {};
  const W = 960, H = 340, pl = 96, pr = 24, pt = 34, pb = 54;
  const cols = BASE.phaseIds.concat(['F']); const n = cols.length;
  const gx = (i) => pl + (i + 0.5) * (W - pl - pr) / n + (i === n - 1 ? 18 : 0);
  const y = (v) => pt + (5 - v) / 4 * (H - pt - pb);
  let s = '';
  NAV.levels.forEach(L => { s += `<line class="grid" x1="${pl - 6}" x2="${W - pr}" y1="${y(L.n)}" y2="${y(L.n)}"/><text class="axis" x="${pl - 12}" y="${y(L.n) + 4}" text-anchor="end">${L.n} ${L.name}</text>`; });
  s += `<line class="sep" x1="${(gx(n - 2) + gx(n - 1)) / 2}" x2="${(gx(n - 2) + gx(n - 1)) / 2}" y1="${pt - 10}" y2="${H - pb + 30}"/>`;
  if (A.stall) { const x = gx(A.stall - 1); s += `<rect class="stallband" x="${x - 46}" y="${pt - 22}" width="92" height="${H - pt - pb + 32}" rx="10"/><text class="stalllbl" x="${x}" y="${pt - 8}" text-anchor="middle">Work stalls here</text>`; }
  const pts = [], tpts = [];
  cols.forEach((id, i) => { const G = A.groups[id]; if (i < 6) { if (G.cur != null) pts.push(`${gx(i)},${y(G.cur)}`); tpts.push(`${gx(i)},${y(G.tgt)}`); } });
  s += `<polyline class="tline" points="${tpts.join(' ')}"/>`;
  if (pts.length > 1) s += `<polyline class="cline" points="${pts.join(' ')}"/>`;
  const snap = (b.snapshots || [])[b.snapshots.length - 1];
  cols.forEach((id, i) => {
    const G = A.groups[id]; const x = gx(i);
    if (snap) { const vals = NAV.bcaps.filter(c => c.g === id).map(c => snap.cur[c.id]).filter(v => v != null); if (vals.length) { const v = vals.reduce((a2, b2) => a2 + b2, 0) / vals.length; s += `<circle class="snapdot" cx="${x - 14}" cy="${y(v)}" r="5"><title>Snapshot ${esc(snap.date)}: ${v.toFixed(1)}</title></circle>`; } }
    s += `<circle class="tring" cx="${x}" cy="${y(G.tgt)}" r="10"><title>Target ${G.tgt.toFixed(1)}</title></circle>`;
    if (G.cur != null) {
      const gap = G.tgt - G.cur; const cls = gap <= 0.25 ? 'ok' : gap <= 1 ? 'mid' : 'big';
      if (gap > 0.05) s += `<line class="dumb ${cls}" x1="${x}" x2="${x}" y1="${y(G.cur)}" y2="${y(G.tgt) + 10}"/>`;
      s += `<circle class="cdot ${cls}" cx="${x}" cy="${y(G.cur)}" r="8"><title>Current ${G.cur.toFixed(1)}</title></circle>`;
    }
    s += `<text class="glbl" x="${x}" y="${H - pb + 20}" text-anchor="middle">${i < 6 ? 'Stage ' + (i + 1) : 'Foundations'}</text><text class="axis" x="${x}" y="${H - pb + 36}" text-anchor="middle">${NAV.bgroups[i].short === 'Foundations' ? 'across stages' : NAV.bgroups[i].short}</text>`;
    s += `<text class="vlbl" x="${x + 14}" y="${(G.cur != null ? y(G.cur) : y(G.tgt)) - 12}">${G.cur != null ? G.cur.toFixed(1) : '—'}<tspan class="muted"> → ${G.tgt.toFixed(1)}</tspan></text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart ladder" role="img" aria-label="Current and target maturity across the six AI lifecycle stages">${s}</svg>`;
};

  valid(o) { return !!(o && o.type === 'enterprise-ai-navigator/benchmark' && Array.isArray(o.groups)); },

BASE.cleanResponse = function (r) {

  const answers = {};

    answers[c.id] = { l: a.l != null && a.l !== '' && isFinite(l) && l >= 1 && l <= 5 ? l : null, dk: !!a.dk, s: ev.includes(a.s) ? a.s : 'assumed', n: s(a.n, 1000) }; });
  const role = Number.isInteger(r.respondent.role) && NAV.roles[r.respondent.role] ? r.respondent.role : null;
  const pick = (v, arr) => Number.isInteger(v) && arr[v] ? v : null;

  const sen = pick(r.respondent.seniority, NAV.seniorities), own = pick(r.respondent.ownership, NAV.ownerships);

    respondent: { name: s(r.respondent.name, 120) || 'Unnamed respondent', email: s(r.respondent.email, 160), role, roleName: role != null ? NAV.roles[role] : 'Other', org: s(r.respondent.org, 160), unit: s(r.respondent.unit, 160),
      industry: ind, industryName: ind != null ? NAV.industries[ind] : '', size, sizeName: size != null ? NAV.sizes[size] : '', region: reg, regionName: reg != null ? NAV.regions[reg] : '',

BASE.combine = function (b) {
  const R = (b.responses || []).filter(r => r.include); const n = R.length; if (!n) return null;
  const evO = ['assumed', 'partial', 'proven'];
  const caps = {}, spread = {}, dk = {}, per = {};
  NAV.bcaps.forEach(c => {
    const rows = R.map(r => ({ r, a: r.answers[c.id] || {} }));
    const lv = rows.filter(x => x.a.l != null).map(x => x.a.l);
    const sv = rows.filter(x => x.a.l != null).map(x => evO.indexOf(x.a.s || 'assumed'));
    const notes = rows.filter(x => x.a.n).map(x => `${NAV.roleShort[x.r.respondent.role] || 'Respondent'}: ${x.a.n}`);
    caps[c.id] = { c: lv.length ? BASE.medianFloor(lv) : null, ev: sv.length ? evO[BASE.medianFloor(sv)] : 'assumed', note: notes.join(' · ') };
    spread[c.id] = lv.length > 1 ? Math.max(...lv) - Math.min(...lv) : 0;
    dk[c.id] = rows.filter(x => x.a.dk).length;
    per[c.id] = rows.map(x => ({ who: x.r.respondent.name, role: x.r.respondent.role, l: x.a.l, dk: !!x.a.dk }));
  });
  const order = ['explore', 'scale', 'aifirst']; const cnt = {}; R.forEach(r => { if (r.ambition) cnt[r.ambition] = (cnt[r.ambition] || 0) + 1; });
  const ambition = Object.keys(cnt).sort((x, y) => cnt[y] - cnt[x] || order.indexOf(x) - order.indexOf(y))[0] || b.ambition;
  const pc = {}; R.forEach(r => (r.patterns || []).forEach(p => pc[p] = (pc[p] || 0) + 1));
  const patterns = Object.keys(pc).filter(p => n < 3 ? pc[p] >= 1 : pc[p] >= 2);
  const orgC = {}; R.forEach(r => { const o = r.respondent.org; if (o) orgC[o] = (orgC[o] || 0) + 1; });
  const org = Object.keys(orgC).sort((x, y) => orgC[y] - orgC[x])[0] || b.meta.org;
  const modeOf = k => { const m = {}; R.forEach(r => { const v = r.respondent[k]; if (v != null) m[v] = (m[v] || 0) + 1; }); const top = Object.keys(m).sort((x, y) => m[y] - m[x])[0]; return top == null ? null : +top; };
  const profile = { industry: modeOf('industry'), size: modeOf('size'), region: modeOf('region'), ownership: modeOf('ownership') };

  const byRole = {};

    byRole[k].n++; NAV.bgroups.forEach(g => { const v = NAV.bcaps.filter(c => c.g === g.id).map(c => (r.answers[c.id] || {}).l).filter(x => x != null); if (v.length) { const e = byRole[k].g[g.id] = byRole[k].g[g.id] || { s: 0, n: 0 }; e.s += v.reduce((a, x) => a + x, 0); e.n += v.length; } }); });
  return { n, caps, spread, dk, per, ambition, patterns, org, profile, outcomes, byRole, units: [...new Set(R.map(r => r.respondent.unit).filter(Boolean))],
    people: R.map(r => ({ name: r.respondent.name, role: r.respondent.roleName || NAV.roles[r.respondent.role], unit: r.respondent.unit, at: (r.submittedAt || '').slice(0, 10) })) };
};

  return `Against published studies, the widest gap with an outside comparison is ${x.cap.n} (${x.cur} today against ${x.t}). For comparison, ${BASE.refSrc(r)} reports ${r.v}. ${r.t}${indT}`;

BASE.findings = function (b, A) {

    const roles = Object.keys(K.byRole).map(r => { const g = K.byRole[r].g; let s = 0, n = 0; Object.values(g).forEach(e => { s += e.s; n += e.n; }); return { r, v: n ? s / n : 0 }; }).sort((x, y) => y.v - x.v);
    const byPh = {}; dis.forEach(x => byPh[x.cap.g] = (byPh[x.cap.g] || 0) + 1); const topPh = Object.keys(byPh).sort((x, y) => byPh[y] - byPh[x])[0];

  canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); return [c, x]; },
  ring(score) {

    x.fillStyle = '#0F2235'; x.textAlign = 'center'; x.font = 'bold 104px Arial'; x.fillText(score == null ? '—' : String(Math.round(v)), cx, cy + 30);
    x.fillStyle = '#586A7B'; x.font = '30px Arial'; x.fillText('out of 100', cx, cy + 78);

  },
  stages(b, A, P) {

    const [c, x] = this.canvas(W, H), X = v => left + (v - 1) / 4 * (W - left - right);
    x.font = '30px Arial'; x.fillStyle = '#586A7B'; x.textAlign = 'center';
    for (let v = 1; v <= 5; v++) { x.strokeStyle = '#E3E8EC'; x.lineWidth = 2; x.beginPath(); x.moveTo(X(v), top - 6); x.lineTo(X(v), top + rows.length * rowH); x.stroke(); x.fillText(String(v), X(v), top + rows.length * rowH + 38); }
    x.fillText('Maturity level, 1 (ad hoc) to 5 (optimised)', left + (W - left - right) / 2, top + rows.length * rowH + 78);
    rows.forEach((r, i) => {

      if (r.s) { x.fillStyle = 'rgba(30,90,130,.20)'; x.fillRect(X(r.s.p25), y - 26, X(r.s.p75) - X(r.s.p25), 52); x.fillStyle = '#5B7C93'; x.fillRect(X(r.s.med) - 2, y - 30, 4, 60); }
      if (cur != null) { x.fillStyle = '#0F2235'; x.fillRect(X(1), y - 14, Math.max(4, X(cur) - X(1)), 28); }
      x.fillStyle = '#C99632'; x.beginPath(); x.moveTo(X(tgt), y - 26); x.lineTo(X(tgt) + 14, y); x.lineTo(X(tgt), y + 26); x.lineTo(X(tgt) - 14, y); x.closePath(); x.fill();
      x.textAlign = 'left'; x.fillStyle = '#0F2235'; x.font = 'bold 34px Arial'; x.fillText(`${cur == null ? '—' : cur.toFixed(1)} → ${tgt.toFixed(1)}`, W - right + 36, y + 12);
    });
    const ly = H - 30; let lx = 10; x.font = '30px Arial'; x.textAlign = 'left';
    const key = (draw, label) => { draw(lx); x.fillStyle = '#586A7B'; x.fillText(label, lx + 46, ly + 9); lx += 46 + x.measureText(label).width + 50; };
    key(p => { x.fillStyle = '#0F2235'; x.fillRect(p, ly - 10, 34, 20); }, 'Today');

  persist() { try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) { UI.toast('Could not save the research dataset in this browser.'); } },
  hash(s) { let h = 2166136261; for (const ch of String(s).toLowerCase().replace(/[^a-z0-9]/g, '')) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return 'o' + (h >>> 0).toString(36); },

  domain(email) { const m = /@([a-z0-9.-]+\.[a-z]{2,})\s*$/i.exec(String(email || '').trim()); if (!m) return null; const d = m[1].toLowerCase(); return this.GENERIC.includes(d) ? null : this.hash('@' + d); },
  /* Turn a cleaned response into an anonymous research row */
  toRow(r) {

    res.cats = NAV.patternLib.map(pt => ({ pt, n: O.filter(o => (o.patterns || []).includes(pt.id)).length })).sort((x, y) => y.n - x.n);
    // perception gap: business leadership vs technology, organisations with both
    const roleAvg = (o, side) => { const rs = rows.filter(r => r.org === o.key && NAV.roleSide(r.role) === side); const lv = rs.flatMap(r => Object.values(r.a).map(x => x.l).filter(x => x != null)); return lv.length ? lv.reduce((x, y) => x + y, 0) / lv.length : null; };
    const both = O.map(o => ({ b: roleAvg(o, 'biz'), t: roleAvg(o, 'tech') })).filter(x => x.b != null && x.t != null);
    res.gap = this.ok(both.length) ? { n: both.length, diff: both.reduce((a, x) => a + (x.b - x.t), 0) / both.length, higherBiz: both.filter(x => x.b > x.t).length } : { n: both.length };
    // by industry (only industries with K+ organisations)
    res.byInd = NAV.industries.map((name, i) => { const os = O.filter(o => o.industry === i); if (!os.length) return null;
      if (!this.ok(os.length)) return { name, n: os.length, hidden: true };
      const st = {}; NAV.bgroups.forEach(g => { const s = this.stats(os.map(o => o.stages[g.id])); st[g.id] = s ? s.mean : null; });
      const ar = {}; os.forEach(o => { const n = o.A.arche ? o.A.arche.name : '—'; ar[n] = (ar[n] || 0) + 1; }); const topAr = Object.keys(ar).sort((x, y) => ar[y] - ar[x])[0];
      return { name, n: os.length, ready: this.stats(os.map(o => o.A.index)).med, beyond2: os.filter(o => o.A.reach >= 2).length, st, topAr, topArN: ar[topAr] };
    }).filter(Boolean);
    return res;
  },
  headlines(R) {
    if (!this.ok(R.nO)) return [];
    const L = [], f1 = v => (Math.round(v * 10) / 10).toFixed(1), seg = this.segLabel();
    L.push(`Across ${R.nO} organisations${seg}, median AI journey readiness is ${Math.round(R.ready.med)} out of 100 (middle half between ${Math.round(R.ready.p25)} and ${Math.round(R.ready.p75)}).`);
    L.push(`${this.pct(R.nO - R.beyond2, R.nO)} cannot yet run AI reliably beyond the first stage of the lifecycle; only ${this.pct(R.O.filter(o => o.A.reach >= 4).length, R.nO)} are reliable through to building AI solutions (Stage 4).`);
    const topA = Object.keys(R.arche).sort((x, y) => R.arche[y] - R.arche[x])[0]; L.push(`The most common profile is “${topA}” (${this.pct(R.arche[topA], R.nO)} of organisations).`);
    const st = NAV.bgroups.filter(g => g.id !== 'F').map(g => ({ g, m: R.stage[g.id] && R.stage[g.id].mean })).filter(x => x.m != null).sort((x, y) => x.m - y.m);
    if (st.length) L.push(`The weakest lifecycle stage is ${st[0].g.name.replace(/^Stage \d · /, '')} (average maturity ${f1(st[0].m)} of 5); the strongest is ${st[st.length - 1].g.name.replace(/^Stage \d · /, '')} (${f1(st[st.length - 1].m)}).`);
    if (R.weak[0]) L.push(`The lowest-rated capability is “${R.weak[0].c.n}” (average ${f1(R.weak[0].mean)} of 5), followed by “${R.weak[1] ? R.weak[1].c.n : '—'}”.`);
    if (R.blind[0] && R.blind[0].dkRate > 0) L.push(`Leaders have least visibility of “${R.blind[0].c.n}”: ${this.pct(Math.round(R.blind[0].dkRate * R.nR), R.nR)} of respondents answered “don’t know”.`);
    if (R.gap.diff != null) L.push(`Where both answered, business leaders rate their organisation ${f1(Math.abs(R.gap.diff))} levels ${R.gap.diff >= 0 ? 'higher' : 'lower'} than technology leaders do (${R.gap.n} organisations).`);
    if (R.cats[0] && R.cats[0].n) L.push(`The most planned AI use-case category is ${R.cats[0].pt.name} (${this.pct(R.cats[0].n, R.nO)} of organisations), followed by ${R.cats[1] ? R.cats[1].pt.name + ' (' + this.pct(R.cats[1].n, R.nO) + ')' : '—'}.`);
    const V = this.valueLink(R.O); if (V.best) L.push(`Organisations that can run AI reliably through Stage ${V.best.k} or beyond are ${(V.best.pA / V.best.pB).toFixed(1)} times as likely to report measured business value from AI in the last 12 months (${this.pct(Math.round(V.best.pA * V.best.nA), V.best.nA)} against ${this.pct(Math.round(V.best.pB * V.best.nB), V.best.nB)}).`);
    const al = R.O.map(o => o.align).filter(x => x != null); if (this.ok(al.length)) L.push(`In ${this.pct(al.filter(x => x > 0).length, al.length)} of organisations with two or more respondents, leaders disagree by two or more levels on at least one capability; the median organisation disagrees on ${Math.round(this.stats(al).med * 28)} of 28.`);
    return L;
  },
  segLabel() { const F = this.f, parts = []; if (F.industry !== 'all') parts.push(NAV.industries[+F.industry]); if (F.size !== 'all') parts.push(NAV.sizes[+F.size]); if (F.region !== 'all') parts.push(NAV.regions[+F.region]); if (F.grp !== 'all') parts.push(NAV.indGroups.find(g => g.id === F.grp).n); if (F.band !== 'all') parts.push(NAV.sizeBands.find(g => g.id === F.band).n); if (F.own !== 'all') parts.push(NAV.ownerships[+F.own]); return parts.length ? ' in ' + parts.join(', ') : ''; },

  /* ---------- benchmark file: peer groups with the 5 / 10 / 30 rules ---------- */
  status(n) { return n >= 30 ? 'firm' : n >= 10 ? 'directional' : 'in tool only'; },
  qs(arr) { const a = arr.filter(x => x != null && isFinite(x)).sort((x, y) => x - y); if (!a.length) return null; const q = p => { const i = (a.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i); return +(a[lo] + (a[hi] - a[lo]) * (i - lo)).toFixed(3); }; return [0.1, 0.2, 0.25, 0.3, 0.4, 0.5, 0.6, 0.7, 0.75, 0.8, 0.9].map(q); },
  group(key, label, O) {
    const n = O.length; if (n < this.K) return null;
    const st = {}; NAV.bgroups.forEach(g => { const v = this.stats(O.map(o => o.stages[g.id])); st[g.id] = v ? { p25: +v.p25.toFixed(2), med: +v.med.toFixed(2), p75: +v.p75.toFixed(2) } : null; });
    const reach = {}; for (let k = 1; k <= 6; k++) reach[k] = +(O.filter(o => o.A.reach >= k).length / n).toFixed(3);
    const al = O.map(o => o.align).filter(x => x != null);
    return { key, label, n, status: this.status(n), index: this.qs(O.map(o => o.A.index)), stages: st, reach, alignMed: al.length >= this.K ? +this.stats(al).med.toFixed(3) : null, alignN: al.length, dkMed: +this.stats(O.map(o => o.dk)).med.toFixed(3) };
  },
  benchmark() {
    const all = this.load().rows; const O = this.orgs(all); const G = [];
    const add = (g) => { if (g) G.push(g); };
    add(this.group('all', 'All organisations', O));
    NAV.indGroups.forEach(g => add(this.group('grp:' + g.id, g.n, O.filter(o => (NAV.indGroupOf(o.industry) || {}).id === g.id))));
    NAV.sizeBands.forEach(b => add(this.group('band:' + b.id, b.n, O.filter(o => (NAV.sizeBandOf(o.size) || {}).id === b.id))));
    NAV.indGroups.forEach(g => NAV.sizeBands.forEach(b => add(this.group('grp:' + g.id + '|band:' + b.id, g.n + ', ' + b.n.toLowerCase(), O.filter(o => (NAV.indGroupOf(o.industry) || {}).id === g.id && (NAV.sizeBandOf(o.size) || {}).id === b.id)))));
    NAV.ownerships.forEach((x, i) => add(this.group('own:' + i, x, O.filter(o => o.ownership === i))));
    const months = all.map(r => r.month).filter(Boolean).sort();
    return { type: 'enterprise-ai-navigator/benchmark', v: 1, name: 'Enterprise AI Navigator India AI Readiness Benchmark', wave: NAV.Q_WAVE, generated: new Date().toISOString().slice(0, 10), field: months.length ? months[0] + ' to ' + months[months.length - 1] : '', organisations: O.length, rules: { show: this.K, publish: 10, firm: 30 }, groups: G };
  },
  /* ---------- readiness to value ---------- */
  valueLink(O) {
    const has = O.filter(o => o.out && o.out.o3 != null); const val = o => o.out.o3 >= 2;
    const rows = []; for (let k = 1; k <= 6; k++) { const a = has.filter(o => o.A.reach >= k), b = has.filter(o => o.A.reach < k);
      rows.push({ k, nA: a.length, nB: b.length, pA: a.length ? a.filter(val).length / a.length : null, pB: b.length ? b.filter(val).length / b.length : null, ok: a.length >= this.K && b.length >= this.K }); }
    const prod = has.filter(o => o.out.o2 != null); const okRows = rows.filter(r => r.ok && r.pB > 0);
    const best = okRows.sort((x, y) => (y.pA / y.pB) - (x.pA / x.pB))[0] || null;
    return { n: has.length, rows, best, prodN: prod.length };
  },
  /* ---------- view ---------- */

      <div class="grid2"><div class="card stack"><h3>Weakest capabilities</h3><table class="t"><tbody>${R.weak.map(x => `<tr><td>${esc(x.c.n)}</td><td class="n">${f1(x.mean)}</td></tr>`).join('')}</tbody></table><h3>Strongest</h3><table class="t"><tbody>${R.strong.map(x => `<tr><td>${esc(x.c.n)}</td><td class="n">${f1(x.mean)}</td></tr>`).join('')}</tbody></table></div>
        <div class="card stack"><h3>Where leaders lack visibility</h3><p class="small muted">Share of respondents answering “don’t know”.</p><table class="t"><tbody>${R.blind.map(x => `<tr><td>${esc(x.c.n)}</td><td class="n">${this.pct(Math.round(x.dkRate * R.nR), R.nR)}</td></tr>`).join('')}</tbody></table></div></div>

  /* ---------- exports ---------- */
  codes() { const m = {}; let i = 0; this.load().rows.forEach(r => { if (!m[r.org]) m[r.org] = 'ORG-' + String(++i).padStart(3, '0'); }); return m; },
  csv() {
    const q = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`, C = this.codes();
    const head = ['response', 'organisation', 'industry', 'size', 'region', 'role', 'month', 'ambition', 'use_case_categories'].concat(NAV.bcaps.map(c => c.id)).concat(NAV.bcaps.map(c => c.id + '_dont_know'));

      .concat(NAV.bcaps.map(c => r.a[c.id] && r.a[c.id].l != null ? r.a[c.id].l : '')).concat(NAV.bcaps.map(c => r.a[c.id] && r.a[c.id].dk ? 1 : 0)).join(',')));

  orgCsv() {

    return out.join('\n');
  },
  report() {
    const R = this.analyse(); if (!this.ok(R.nO)) return null;
    return `<div class="stack" style="gap:18px"><div><span class="eyebrow">Enterprise AI Navigator · Industry data points</span><h2>AI readiness${esc(this.segLabel())}</h2><p class="small muted">${R.nO} organisations, ${R.nR} responses, self-assessed. Organisation-level results; groups under ${this.K} organisations hidden. Generated ${new Date().toISOString().slice(0, 10)}.</p></div>
      ${this.view().replace(/<div class="sec-head">[\s\S]*?<\/div><\/div>\s*<div class="card row"[\s\S]*?<\/div>\s*<div class="row" style="gap:12px;flex-wrap:wrap">[\s\S]*?<\/div>/, '').replace(/<button[^>]*data-act="insCopy"[^>]*>[^<]*<\/button>/, '')}</div>`;
  }
};

  start() {
    this.prevActive = this.ws().active; this.on = true; this.i = 0; this.done = {}; this.min = false;
    const W = this.ws(); if (!W.demoPrevBaseline) W.demoPrevBaseline = JSON.parse(JSON.stringify(W.baseline)); W.baseline = NAV.sampleBaseline(); this.prevBench = BENCH.d; BENCH.d = JSON.parse(JSON.stringify(DEMO_BENCH)); this.prevPeer = (App.ui || {}).peerGrp; if (App.ui) App.ui.peerGrp = null;
    const s = NAV.sample(); s.id = 'demo'; s.meta.project = 'Demo: bank service assistant';
    const ws = this.ws(); ws.projects = ws.projects.filter(p => p.id !== 'demo'); ws.projects.push(migrate(s)); ws.active = ws.projects.length - 1;
    this.go(0);
  },
  ws() { return App.ws; },
  build(stateMods) {
    const ws = this.ws(); const idx = ws.projects.findIndex(p => p.id === 'demo');
    const s = migrate(NAV.sample()); s.id = 'demo'; s.meta.project = 'Demo: bank service assistant';
    stateMods.forEach(m => this.mods[m](s));
    ws.projects[idx] = s; ws.active = idx;
  },
  go(i) {
    this.i = clamp(i, 0, this.steps.length - 1); const st = this.steps[this.i];
    this.done = {}; st.state.forEach(m => this.done[m] = true);
    this.build(st.state);
    App.ws.tool = st.tool; App.ws.tab[st.tool] = st.tab;
    App.render(); this.panel(); setTimeout(() => this.focus(true), 60);
  },
  act() {
    const st = this.steps[this.i]; if (!st.act) return;
    this.mods[st.act](App.p); this.done[st.act] = true; App._snap = {}; App.render(); this.panel(); this.focus(false);
  },
  exit() {
    this.on = false; $$('.demo-focus').forEach(e => e.classList.remove('demo-focus'));
    const ws = this.ws(); if (ws.demoPrevBaseline) { ws.baseline = ws.demoPrevBaseline; delete ws.demoPrevBaseline; } BENCH.d = this.prevBench === undefined ? undefined : this.prevBench; if (App.ui) App.ui.peerGrp = this.prevPeer; ws.projects = ws.projects.filter(p => p.id !== 'demo');
    ws.active = clamp(this.prevActive, 0, ws.projects.length - 1); ws.tool = 'gng'; ws.tab.gng = 'overview';
    $$('.coach').forEach(c => c.remove()); App.persist(); App.render(); UI.toast('Demo closed. Your own use cases are unchanged.');
  },
  focus(scroll) {
    if (!this.on) return; $$('.demo-focus').forEach(e => e.classList.remove('demo-focus'));
    const el = document.querySelector(this.steps[this.i].target); if (!el) return;
    el.classList.add('demo-focus'); if (scroll) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  panel() {
    $$('.coach').forEach(c => c.remove()); if (!this.on) return;
    const st = this.steps[this.i], s = this.snap(), n = this.steps.length;
    const c = document.createElement('aside'); c.className = 'coach' + (this.min ? ' min' : ''); c.setAttribute('aria-label', 'Demo guide');
    c.innerHTML = `<div class="coach-head"><span class="eyebrow">Guided demo · step ${this.i + 1} of ${n}</span><div class="row" style="gap:4px"><button class="btn sm" data-demo="min" aria-label="${this.min ? 'Expand' : 'Minimise'} guide">${this.min ? 'Expand' : 'Minimise'}</button><button class="btn sm" data-demo="exit">Exit demo</button></div></div>
      <div class="coach-dots">${this.steps.map((_, k) => `<button class="${k === this.i ? 'on' : k < this.i ? 'past' : ''}" data-demo="go" data-k="${k}" aria-label="Go to step ${k + 1}"></button>`).join('')}</div>
      <h3>${esc(st.title)}</h3>
      <div class="coach-body"><div class="say"><span>Say</span><p>${esc(st.say(s))}</p></div>
      <div class="do"><span>Do</span><p>${esc(st.doo)}</p></div>
      ${st.act ? (this.done[st.act] ? `<p class="done">✓ Done. The numbers above are live.</p>` : `<button class="btn pri" data-demo="act">${esc(st.actLabel)}</button>`) : ''}</div>
      <div class="row coach-nav"><button class="btn" data-demo="back" ${this.i === 0 ? 'disabled' : ''}>Back</button><span class="grow small muted">Arrow keys also move</span>${st.last ? '<button class="btn pri" data-demo="exit">Finish</button>' : '<button class="btn pri" data-demo="next">Next</button>'}</div>`;
    document.body.appendChild(c);
  },
  bind() {
    document.addEventListener('click', e => {
      const b = e.target.closest('[data-demo]'); if (!b) return;
      const k = b.dataset.demo;
      if (k === 'next') this.go(this.i + 1); else if (k === 'back') this.go(this.i - 1); else if (k === 'go') this.go(+b.dataset.k);
      else if (k === 'act') this.act(); else if (k === 'exit') this.exit(); else if (k === 'min') { this.min = !this.min; this.panel(); }
    });
    document.addEventListener('keydown', e => {
      if (!this.on || e.target.closest('input, textarea, select')) return;
      if (e.key === 'ArrowRight') { e.preventDefault(); if (this.i < this.steps.length - 1) this.go(this.i + 1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); if (this.i > 0) this.go(this.i - 1); }
    });
  },
  afterRender() { if (this.on) { this.focus(false); const c = document.querySelector('.coach'); if (c && !c.contains(document.activeElement)) this.panel(); } }
};

    const bm = ws.baseline.meta = ws.baseline.meta || {};
    if (!bm.lists) { ['industry', 'size'].forEach(k => { if (bm[k] != null && bm[k] !== '' && +bm[k] >= 0) { const v = NAV.mapOld(k, bm[k]); bm[k] = v == null ? -1 : v; } }); bm.lists = 4; }

        case 'baseDocx': { UI.toast('Building the Word report…'); RPT.blob(this.ws.baseline).then(bl => bl.arrayBuffer()).then(buf => this.save(RPT.fname(this.ws.baseline), new Uint8Array(buf))).catch(err => { console.error(err); UI.toast('Could not build the Word report.'); }); break; }
        case 'refK': this.ui = this.ui || {}; this.ui.refK = d.v; this.render(); break;
        case 'libCat': this.ui = this.ui || {}; this.ui.libCat = d.v; this.ui.libFn = 'all'; this.render(); break;
        case 'libFn': this.ui = this.ui || {}; this.ui.libFn = d.v; this.render(); break;
        case 'addLib': { const e = NAV.driverLibById(d.id); if (!e) break; const T = NAV.driverTypes[e.type]; const pt = NAV.patternById(e.c);
          if (!(p.meta.patterns || []).includes(pt.name)) { p.meta.patterns = (p.meta.patterns || []).concat(pt.name); migrate(p); }
          p.impact.drivers.push({ id: uid('d'), lib: e.id, pattern: e.c, name: e.n, type: e.type, labels: e.L.slice(), labelsFor: e.type, cat: e.cat, v: T.fields.map(() => 0), nonAI: 10, capture: e.cat === 'cost' ? 75 : 100, conf: 'med', ttv: NAV.ttr[pt.ttr].ttv, kpi: { lead: e.lead, lag: e.lag, base: '', target: '', owner: '' } });
          rr(); UI.toast('Added to value drivers — enter your figures below'); break; }
        case 'delCost': p.impact.costs.splice(+d.i, 1); rr(); break;
        case 'addRisk': p.impact.risks.push({ id: uid('r'), name: '', layer: 'Valid and reliable', p: 0, impact: 0, mit: '' }); rr(); break;
        case 'delRisk': p.impact.risks.splice(+d.i, 1); rr(); break;
        case 'addKpi': p.impact.techKpis.push({ kpi: '', target: '', owner: '' }); rr(); break;
        case 'delKpi': p.impact.techKpis.splice(+d.i, 1); rr(); break;
        case 'pick': this.ws.active = +d.i; this.ws.tool = 'gng'; this.ws.tab.gng = 'overview'; rr(); break;
        case 'newProject': { const n = NAV.blank(); n.id = uid('p'); n.meta.project = 'Use case ' + (this.ws.projects.length + 1); this.ws.projects.push(n); this.ws.active = this.ws.projects.length - 1; this.ws.tool = 'gng'; this.ws.tab.gng = 'overview'; rr(); UI.toast('Blank use case created'); break; }
        case 'dupProject': { this.closeModal(); const n = deep(p); n.id = uid('p'); const m = /(\d+)/.exec(n.meta.iteration || ''); n.meta.iteration = m ? n.meta.iteration.replace(m[1], String(+m[1] + 1)) : (n.meta.iteration || 'Iteration') + ' (copy)'; n.meta.date = new Date().toISOString().slice(0, 10); this.ws.projects.push(n); this.ws.active = this.ws.projects.length - 1; rr(); UI.toast('Duplicated as ' + n.meta.iteration); break; }
        case 'menu': this.menu(); break;
        case 'key': this.openKey(); break;
        case 'bScore': { const c = this.ws.baseline.caps[d.id]; const v = +d.v; if (d.f === 'c') c.c = c.c === v ? null : v; else c.t = v; rr(); break; }
        case 'bEv': this.ws.baseline.caps[d.id].ev = d.v; rr(); break;
        case 'bGroup': this.bGroup = d.g; this.ws.tool = 'base'; this.ws.tab.base = 'assess'; window.scrollTo(0, 0); rr(); break;
        case 'bGoto': { const cap = NAV.bcapById(d.id); this.bGroup = cap.g; this.ws.tab.base = 'assess'; rr(); const el = document.getElementById('bc_' + d.id.replace('.', '_')); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); break; }
        case 'bAmb': this.ws.baseline.ambition = d.v; this.ws.baseline.ambitionSet = true; rr(); break;
        case 'bPat': { const ps = this.ws.baseline.patterns; const i = ps.indexOf(d.v); if (i >= 0) ps.splice(i, 1); else ps.push(d.v); rr(); break; }
        case 'bClearT': NAV.bcaps.forEach(c => { this.ws.baseline.caps[c.id].t = null; }); rr(); UI.toast('Targets reset to ambition and categories'); break;
        case 'bSnap': { const cur = {}; NAV.bcaps.forEach(c => cur[c.id] = this.ws.baseline.caps[c.id].c); this.ws.baseline.snapshots.push({ date: new Date().toISOString().slice(0, 10), cur }); rr(); UI.toast('Snapshot saved — the ladder will show it as a grey marker'); break; }
        case 'baseToUseCase': {
          const b = this.ws.baseline; const n = NAV.blank(); n.id = uid('p'); n.meta.org = (b.meta.org || '').replace(/^Sample: /, ''); n.meta.project = 'Use case ' + (this.ws.projects.length + 1);
          Object.keys(NAV.baseToFactor).forEach(fid => { const v = BASE.factorFrom(b, fid); if (v) { const f = n.factors[fid]; f.s = v.s; f.ev = 'assumed'; f.note = 'Pre-filled from the readiness baseline (' + b.meta.date + '): ' + v.ids.map(id => NAV.bcapById(id).n + ' at level ' + b.caps[id].c).join('; ') + '. Confirm for this use case.'; } });
          this.ws.projects.push(migrate(n)); this.ws.active = this.ws.projects.length - 1; this.ws.tool = 'gng'; this.ws.tab.gng = 'phase1'; window.scrollTo(0, 0); rr(); UI.toast('Use case created with baseline scores, marked as assumed'); break; }
        case 'rToggle': this.ws.baseline.responses[+d.i].include = b.checked; this.persist(); this.render(); break;
        case 'rDel': this.ws.baseline.responses.splice(+d.i, 1); rr(); break;
        case 'rPasteImport': { const t = ($('#rPaste') || {}).value || ''; this.importResponses([t]); break; }
        case 'rCombine': { const n = this.ws.baseline.responses.filter(r => r.include).length; this.modal(`<h3>Combine ${n} response${n > 1 ? 's' : ''}?</h3><p class="small">This replaces today's scores, the ambition and the AI use-case categories in the baseline with the respondents' combined view (median per capability). Hand-set targets are kept. Save a snapshot first if you want to keep the current scores for comparison.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn pri" data-act="rCombineGo">Combine</button></div>`); break; }
        case 'rCombineGo': { this.closeModal(); const C = BASE.applyCombined(this.ws.baseline); this.ws.tab.base = 'overview'; window.scrollTo(0, 0); rr(); if (C) UI.toast(`Baseline built from ${C.n} respondent${C.n > 1 ? 's' : ''}`); break; }
        case 'copyQ': this.copy(BASE.inviteURL(), 'Questionnaire link copied'); break;
        case 'refAll': this.ui = this.ui || {}; this.ui.refAll = !this.ui.refAll; rr(); break;
        case 'copyInvite': this.copy(BASE.inviteText(), 'Invitation email copied'); break;
        case 'bAsk': { this.closeModal(); const b0 = this.ws.baseline; const used = NAV.bcaps.some(c => b0.caps[c.id] && b0.caps[c.id].c != null) || (b0.responses || []).length;
          if (!used) { this.trigger(d.v === 'sample' ? 'bLoadSample' : 'bBlank'); break; }
          this.modal(`<h3>Replace ${esc(this.custName())}’s readiness baseline?</h3><p class="small">This clears today’s scores, the ambition and the imported questionnaire responses for this customer. It cannot be undone. Use cases are kept.</p><div class="row" style="justify-content:flex-end;gap:8px"><button class="btn" data-close>Cancel</button><button class="btn danger" data-act="${d.v === 'sample' ? 'bLoadSample' : 'bBlank'}">Replace the baseline</button></div>`); break; }
        case 'bLoadSample': this.closeModal(); this.ws.baseline = NAV.sampleBaseline(); this.ws.tool = 'base'; this.ws.tab.base = 'overview'; rr(); UI.toast('Sample baseline loaded'); break;
        case 'bBlank': this.closeModal(); this.ws.baseline = NAV.blankBaseline(); this.ws.tool = 'base'; this.ws.tab.base = 'ambition'; rr(); UI.toast('Blank baseline ready — start with your ambition'); break;
        case 'demo': this.closeModal(); Demo.start(); break;
        case 'keyClose': this.closeKey(); break;
        case 'keyJump': { const el = document.getElementById('kg_' + d.g); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
        case 'legacyRestore': { const L = Store.legacy(); if (!L) { delete this.ws.legacy; rr(); break; }
          const keep = L.ws.projects.filter(p => p && p.id !== 'demo' && !isRetiredProject(p, true)).map(migrate);
          const cur = this.ws.projects.filter(p => !isRetiredProject(p, true));
          this.ws.projects = keep.concat(cur); if (!this.ws.projects.length) { const n = NAV.blank(); n.id = uid('p'); n.meta.project = 'Use case 1'; this.ws.projects.push(migrate(n)); }
          if (L.ws.baseline && L.ws.baseline.caps) { this.ws.baseline = L.ws.baseline; NAV.bcaps.forEach(c => { if (!this.ws.baseline.caps[c.id]) this.ws.baseline.caps[c.id] = { c: null, t: null, ev: 'assumed', note: '' }; }); this.ws.baseline.snapshots = this.ws.baseline.snapshots || []; this.ws.baseline.patterns = this.ws.baseline.patterns || []; }
          this.ws.active = 0; this.ws.fresh = false; delete this.ws.legacy; Store.dropLegacy(); this._snap = {}; this.persist(); rr(); UI.toast('Earlier work restored'); break; }
        case 'legacyDrop': Store.dropLegacy(); delete this.ws.legacy; this.persist(); rr(); UI.toast('Earlier work removed from this browser'); break;
        case 'insFromWs': { const rs = (this.ws.baseline.responses || []); if (!rs.length) { UI.toast('No questionnaire responses in this workspace yet.'); break; } const r = INS.add(rs); UI.toast(`${r.added} added${r.dup ? ' · ' + r.dup + ' already in' : ''}${r.noConsent ? ' · ' + r.noConsent + ' skipped (no research consent)' : ''}`); rr(); break; }
        case 'insCsv': this.save('navigator-research-dataset-anonymised.csv', INS.csv()); break;
        case 'insBench': { const B = INS.benchmark(); if (!B.groups.length) { UI.toast(`At least ${INS.K} organisations are needed before a benchmark file can be published.`); break; } this.save('benchmark.json', JSON.stringify(B, null, 1)); UI.toast(`Benchmark file with ${B.groups.length} peer groups from ${B.organisations} organisations. Put it next to the Navigator tool as benchmark.json.`); break; }
        case 'benchClear': BENCH.clear(); this.closeModal(); this.render(); UI.toast('Benchmark removed'); break;
        case 'peerGrp': this.ui = this.ui || {}; this.ui.peerGrp = d.v; this.render(); break;
        case 'insOrgCsv': { const c = INS.orgCsv(); if (!c) { UI.toast(`Needs at least ${INS.K} organisations.`); break; } this.save('navigator-organisation-summary.csv', c); break; }
        case 'insReport': { const h = INS.report(); if (!h) { UI.toast(`Needs at least ${INS.K} organisations.`); break; } this.save('navigator-industry-data-points.html', this.standalone('Enterprise AI Navigator — industry data points', h)); break; }
        case 'insCopy': { const R = INS.analyse(); this.copy(INS.headlines(R).map((x, i) => (i + 1) + '. ' + x).join('\n'), 'Data points copied'); break; }
        case 'insClear': { this.modal(`<h3>Clear the research dataset?</h3><p class="small">This removes all ${INS.load().rows.length} stored responses from this browser’s research dataset. Customer workspaces are not affected. Download the anonymised CSV first if you need it.</p><div class="row" style="justify-content:flex-end;gap:8px"><button class="btn" data-close>Cancel</button><button class="btn danger" data-act="insClearGo">Clear dataset</button></div>`); break; }
        case 'insClearGo': INS.data = { rows: [], skipped: 0, imported: 0 }; INS.persist(); this.closeModal(); rr(); UI.toast('Research dataset cleared'); break;
        case 'orgPickGo': { const P = this._pending; const v = (document.querySelector('input[name=orgPick]:checked') || {}).value; this.closeModal(); if (!P || !v) break;
          this._orgPick = true; try { this.importResponses([JSON.stringify(P.groups[v].list)]); } finally { this._orgPick = false; this._pending = null; } break; }
        case 'orgPickIns': { const P = this._pending; this.closeModal(); if (!P) break; const all = Object.values(P.groups).flatMap(g => g.list); const r = INS.add(all); this._pending = null; this.ws.tool = 'ins'; rr();
          UI.toast(`${r.added} added to Industry insights${r.noConsent ? ' · ' + r.noConsent + ' skipped (no research consent)' : ''}`); break; }
        case 'freshAsk': { this.closeModal(); const keep = this.hasData();
          this.modal(`<h3>New customer</h3>
            <p class="small">${keep ? `${esc(this.custName())} stays saved in this browser. Switch back any time from the customer list at the top.` : 'Opens a clean workspace for the customer.'}</p>
            <label class="f"><span>Customer or organisation name</span><input id="freshOrg" type="text" placeholder="e.g. Acme Bank" autocomplete="off"></label>
            <label class="f"><span>First AI use case (optional)</span><input id="freshCase" type="text" placeholder="e.g. Invoice processing assistant" autocomplete="off"></label>
            <div class="row" style="justify-content:flex-end;gap:8px">
              <button class="btn" data-close>Cancel</button>
              <button class="btn pri" data-act="freshGo">Create customer</button></div>`);
          break; }
        case 'welcomeSample': { const s = NAV.sample(); s.id = uid('p'); this.ws.projects.push(migrate(s)); this.ws.baseline = NAV.sampleBaseline(); this.ws.welcomeDone = true; this.ws.active = this.ws.projects.length - 1; rr(); UI.toast('Sample loaded: an Indian bank, ready to explore'); break; }
        case 'welcomeDemo': this.ws.welcomeDone = true; Demo.start(); break;
        case 'welcomeHide': this.ws.welcomeDone = true; rr(); break;
        case 'freshGo': { const org = (($('#freshOrg') || {}).value || '').trim().slice(0, 120), uc = (($('#freshCase') || {}).value || '').trim().slice(0, 120); this.closeModal(); this.newCustomer(org, uc); break; }
        case 'delCustAsk': { this.closeModal(); this.modal(`<h3>Delete ${esc(this.custName())}?</h3><p class="small">This removes the customer’s readiness baseline, responses and every use case from this browser. It cannot be undone. Export the customer first if you may need it.</p><div class="row" style="justify-content:flex-end;gap:8px">${this.dl ? '<button class="btn" data-act="download" data-k="ws">Export first</button>' : ''}<button class="btn" data-close>Cancel</button><button class="btn danger" data-act="delCustGo">Delete customer</button></div>`); break; }
        case 'delCustGo': this.closeModal(); this.deleteCustomer(); break;
        case 'benchLoadPick': { const i = $('#benchFile'); if (i) i.click(); break; }
        case 'loadSample': { const s = NAV.sample(); s.id = uid('p'); this.ws.projects.push(s); this.ws.active = this.ws.projects.length - 1; this.closeModal(); rr(); UI.toast('Sample added'); break; }
        case 'delProject': this.closeModal(); { const m = this.modal(`<h3>Delete “${esc(p.meta.project || 'Untitled')}”?</h3><p class="small">This removes the use case from this browser. Export the workspace first if you may need it.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn pri" data-act="confirmDel">Delete</button></div>`); } break;
        case 'confirmDel': this.ws.projects.splice(this.ws.active, 1); if (!this.ws.projects.length) { const s = NAV.blank(); s.id = uid('p'); this.ws.projects.push(s); } this.ws.active = Math.max(0, this.ws.active - 1); this.closeModal(); rr(); break;
        case 'importText': { const t = ($('#impText') || {}).value || ''; this.closeModal(); this.importJSON(t); break; }
        case 'copyWs': this.copy(JSON.stringify(this.ws, null, 1), 'Workspace JSON copied'); break;
        case 'copySummary': this.copy(this.textSummary(d.k), 'Summary copied'); break;
        case 'download': {
          const slug = (p.meta.project || 'ai-use-case').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'use-case';
          if (d.k === 'ws') this.save(`navigator-customer-${(this.custName().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'customer')}.json`, JSON.stringify(this.ws, null, 1));
          if (d.k === 'gngReport') this.save(`${slug}-decision-compass.html`, this.standalone('Decision Compass report — ' + (p.meta.project || ''), GNG.reportHTML(p)));
          if (d.k === 'impReport') this.save(`${slug}-ai-impact.html`, this.standalone('AI Impact report — ' + (p.meta.project || ''), IMP.reportHTML(p)));
          if (d.k === 'csv') this.save(`${slug}-cash-flows.csv`, this.csv());
          if (d.k === 'budget') this.save(`${slug}-ai-budget.csv`, this.budgetCsv());
          if (d.k === 'refs') this.save('navigator-reference-library.csv', BASE.refCsv());
          if (d.k === 'baseReport') this.save('ai-readiness-gap-analysis-' + ((this.ws.baseline.meta.org || 'org').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 30) || 'org') + '.html', this.standalone('AI readiness gap analysis — ' + (this.ws.baseline.meta.org || ''), BASE.reportHTML(this.ws.baseline)));
          break;
        }
      }
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') { this.closeKey(); this.closeModal(); } });
    window.addEventListener('hashchange', () => { this.fromHash(); this.render(); });
  },
  closeModal() { $$('.modal-bg').forEach(m => m.remove()); },
  openKey() {
    this.closeKey(); const w = document.createElement('div'); w.innerHTML = KEY.panel(['imp', 'base'].includes(this.ws.tool) ? this.ws.tool : 'gng');
    const bg = w.firstElementChild; document.body.appendChild(bg);
    bg.addEventListener('click', e => { if (e.target === bg) this.closeKey(); });
    const s = $('#keySearch', bg); s.focus();
    s.addEventListener('input', () => { const q = s.value.trim().toLowerCase(); let any = 0;
      $$('.kgroup', bg).forEach(g => { let n = 0; $$('.kitem', g).forEach(it => { const hit = !q || it.dataset.k.includes(q); it.hidden = !hit; if (hit) n++; }); g.hidden = n === 0; any += n; });
      $('.kempty', bg).hidden = any > 0; });
  },
  closeKey() { $$('.drawer-bg').forEach(m => m.remove()); }
};

App.init();
</script></body></html>
